<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binary Boxer — Manager Mode Prototype</title>
<style>
/* ============================================================
   BINARY BOXER — storybook-industrial design tokens
   Authority: docs/binary-boxing/design-tokens.md
   ============================================================ */
:root{
  /* Workshop darks (warm, never pure black) */
  --bb-bg:        #1c140e;
  --bb-bg-deep:   #140e09;
  --bb-surface:   #2a1e14;
  --bb-surface-2: #342619;
  --bb-surface-3: #3f2f1f;
  /* Warm metals */
  --bb-brass:     #c9963f;
  --bb-brass-hi:  #ecc06a;
  --bb-brass-lo:  #8a6425;
  --bb-copper:    #b87352;
  --bb-iron:      #57493c;
  /* Jewel enamels */
  --bb-teal:      #2b8c82;
  --bb-teal-hi:   #46b3a7;
  --bb-garnet:    #b04353;
  --bb-garnet-hi: #d4687a;
  --bb-royal:     #3d6fa8;
  --bb-royal-hi:  #6494cc;
  --bb-moss:      #6d8a3f;
  --bb-moss-hi:   #8fb05e;
  --bb-amber:     #ffb84d;
  /* Parchment & ink */
  --bb-parchment: #f2e4c8;
  --bb-parch-dim: #d9c6a3;
  --bb-ink:       #2b2118;
  --bb-ink-soft:  #4a3a2a;
  /* Text on dark */
  --bb-text:      #f0e2c4;
  --bb-text-dim:  #bda887;
  --bb-text-faint:#8a785f;
  /* Semantics */
  --bb-win:       var(--bb-moss-hi);
  --bb-loss:      var(--bb-garnet-hi);
  --bb-danger:    #d24b45;
  --bb-focus:     #ffd98a;
  /* Type scale (fluid) */
  --fs-hero:  clamp(1.7rem, 4.5vw, 2.6rem);
  --fs-title: clamp(1.25rem, 3vw, 1.7rem);
  --fs-sub:   clamp(1.02rem, 2.2vw, 1.2rem);
  --fs-body:  clamp(.92rem, 1.8vw, 1rem);
  --fs-small: clamp(.8rem, 1.5vw, .86rem);
  --fs-tiny:  .72rem;
  --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
  --font-ui: 'Segoe UI', -apple-system, 'Helvetica Neue', system-ui, sans-serif;
  --font-mono: 'Cascadia Code', 'Consolas', 'JetBrains Mono', monospace;
  /* Geometry */
  --r-sm: 6px; --r-md: 10px; --r-lg: 16px; --r-pill: 999px;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 24px; --space-6: 32px; --space-7: 48px;
  /* Motion — weight & anticipation */
  --ease-spring: cubic-bezier(.28,1.4,.42,1);
  --ease-heavy:  cubic-bezier(.2,.8,.2,1);
  --t-fast: 140ms; --t-med: 260ms; --t-slow: 420ms;
  /* Elevation & bevels */
  --bevel-out: inset 0 1px 0 rgba(255,235,190,.16), inset 0 -2px 0 rgba(0,0,0,.35);
  --bevel-in:  inset 0 2px 6px rgba(0,0,0,.5), inset 0 -1px 0 rgba(255,235,190,.08);
  --shadow-1: 0 2px 6px rgba(0,0,0,.4);
  --shadow-2: 0 6px 18px rgba(0,0,0,.5);
  --shadow-3: 0 14px 40px rgba(0,0,0,.55);
  /* Language enamels (identity hues re-tuned to enamel) */
  --lang-rust: #c67549; --lang-javascript:#d9b13b; --lang-python:#4879a8;
  --lang-cpp:#7a6db3; --lang-css:#c25f8a; --lang-go:#4aa3ad;
  --lang-typescript:#5a7fc0; --lang-c:#9a9484; --lang-haskell:#8a68a8; --lang-lua:#5f6fb0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(1200px 600px at 70% -10%, rgba(201,150,63,.08), transparent 60%),
    radial-gradient(900px 500px at 10% 110%, rgba(43,140,130,.06), transparent 55%),
    var(--bb-bg);
  color:var(--bb-text);
  font-family:var(--font-ui);
  font-size:var(--fs-body);
  line-height:1.5;
  min-height:100vh;
  overflow-x:hidden;
}
/* Rivet-plate texture backdrop */
body::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.05;
  background-image:radial-gradient(circle at 2px 2px, #000 1px, transparent 1.6px);
  background-size:26px 26px;}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
:focus-visible{outline:3px solid var(--bb-focus);outline-offset:2px;border-radius:4px}
h1,h2,h3,.display{font-family:var(--font-display);letter-spacing:.01em}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============================================================
   APP SHELL
   ============================================================ */
#app{max-width:1180px;margin:0 auto;padding:0 var(--space-4) 120px;min-height:100vh}
.masthead{
  display:flex;align-items:center;gap:var(--space-3);
  padding:var(--space-3) 0 var(--space-2);
  border-bottom:2px solid var(--bb-brass-lo);
  position:relative;
}
.masthead::after{content:'';position:absolute;left:0;right:0;bottom:-5px;height:2px;
  background:linear-gradient(90deg, transparent, var(--bb-brass-lo), transparent);opacity:.5}
.marque{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.marque .gear{width:34px;height:34px;flex:none}
.marque h1{font-size:var(--fs-sub);color:var(--bb-brass-hi);white-space:nowrap}
.marque small{display:block;font-family:var(--font-ui);font-size:var(--fs-tiny);
  color:var(--bb-text-faint);letter-spacing:.14em;text-transform:uppercase}
.masthead .spacer{flex:1}
.coin-purse{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);
  font-size:var(--fs-small);color:var(--bb-amber);
  background:var(--bb-surface);border:1px solid var(--bb-brass-lo);border-radius:var(--r-pill);
  padding:4px 12px;box-shadow:var(--bevel-out)}
/* Primary nav — brass tab rail */
.tab-rail{display:flex;gap:2px;margin-top:var(--space-3);overflow-x:auto;scrollbar-width:none;
  padding-bottom:2px}
.tab-rail::-webkit-scrollbar{display:none}
.tab{
  flex:none;display:flex;align-items:center;gap:7px;
  padding:9px 14px;border-radius:var(--r-md) var(--r-md) 0 0;
  background:linear-gradient(180deg, var(--bb-surface-2), var(--bb-surface));
  border:1px solid var(--bb-brass-lo);border-bottom:none;
  color:var(--bb-text-dim);font-size:var(--fs-small);font-weight:600;
  box-shadow:var(--bevel-out);
  transition:transform var(--t-fast) var(--ease-heavy), color var(--t-fast);
  position:relative;top:2px;
}
.tab:hover{color:var(--bb-text);transform:translateY(-2px)}
.tab[aria-selected="true"]{
  background:linear-gradient(180deg, var(--bb-surface-3), var(--bb-surface-2));
  color:var(--bb-brass-hi);top:0;padding-bottom:11px;
  border-color:var(--bb-brass);
}
.tab .ico{width:15px;height:15px;flex:none}
.tab:disabled{opacity:.42;cursor:not-allowed;transform:none}
main{padding-top:var(--space-5)}
.screen{animation:screenIn var(--t-slow) var(--ease-heavy) both}
@keyframes screenIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ============================================================
   CORE COMPONENTS
   ============================================================ */
/* Plate card — riveted panel */
.plate{
  background:linear-gradient(180deg, var(--bb-surface-2), var(--bb-surface));
  border:1px solid var(--bb-brass-lo);
  border-radius:var(--r-lg);
  box-shadow:var(--bevel-out), var(--shadow-1);
  padding:var(--space-5);
  position:relative;
}
.plate.rivets::before,.plate.rivets::after{
  content:'';position:absolute;width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--bb-brass-hi), var(--bb-brass-lo) 70%);
  box-shadow:0 1px 2px rgba(0,0,0,.6);
}
.plate.rivets::before{top:10px;left:10px}
.plate.rivets::after{top:10px;right:10px}
.plate-title{font-size:var(--fs-title);color:var(--bb-brass-hi);margin-bottom:var(--space-2)}
.plate-kicker{font-size:var(--fs-tiny);letter-spacing:.18em;text-transform:uppercase;
  color:var(--bb-text-faint);margin-bottom:var(--space-1);font-family:var(--font-ui)}
/* Parchment inset — for prose/scout notes */
.parchment{
  background:linear-gradient(180deg, var(--bb-parchment), var(--bb-parch-dim));
  color:var(--bb-ink);border-radius:var(--r-md);
  padding:var(--space-4) var(--space-5);
  box-shadow:var(--bevel-in), 0 1px 0 rgba(255,235,190,.15);
  font-size:var(--fs-body);
}
.parchment .quill{font-family:var(--font-display);font-style:italic}
/* Brass buttons — heavy, tactile */
.btn{
  --btn-bg1:var(--bb-brass-hi); --btn-bg2:var(--bb-brass); --btn-edge:var(--bb-brass-lo);
  --btn-fg:var(--bb-ink);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-weight:700;font-size:var(--fs-small);letter-spacing:.03em;
  color:var(--btn-fg);
  background:linear-gradient(180deg, var(--btn-bg1), var(--btn-bg2));
  border:1px solid var(--btn-edge);
  border-radius:var(--r-md);
  padding:11px 20px;
  box-shadow:var(--bevel-out), 0 3px 0 var(--btn-edge), var(--shadow-1);
  transition:transform var(--t-fast) var(--ease-heavy), box-shadow var(--t-fast) var(--ease-heavy), filter var(--t-fast);
  text-transform:uppercase;
  min-height:44px;
}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px);
  box-shadow:var(--bevel-out), 0 4px 0 var(--btn-edge), var(--shadow-2)}
.btn:active{transform:translateY(2px);box-shadow:var(--bevel-out), 0 1px 0 var(--btn-edge)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:grayscale(.4)}
.btn.teal{--btn-bg1:var(--bb-teal-hi);--btn-bg2:var(--bb-teal);--btn-edge:#175650;--btn-fg:#08211e}
.btn.garnet{--btn-bg1:var(--bb-garnet-hi);--btn-bg2:var(--bb-garnet);--btn-edge:#6e2531;--btn-fg:#fff2ee}
.btn.ghost{--btn-bg1:var(--bb-surface-3);--btn-bg2:var(--bb-surface-2);--btn-edge:var(--bb-iron);
  --btn-fg:var(--bb-text);text-transform:none;font-weight:600}
.btn.big{font-size:var(--fs-sub);padding:15px 30px;border-radius:var(--r-lg)}
.btn.small{padding:7px 12px;min-height:36px;font-size:var(--fs-tiny)}
/* Enamel badge */
.badge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:var(--fs-tiny);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 11px;border-radius:var(--r-pill);
  background:var(--badge-bg, var(--bb-teal));color:var(--badge-fg, #eafffb);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28), inset 0 -1px 2px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.4);
  border:1px solid rgba(0,0,0,.35);
}
.badge.garnet{--badge-bg:var(--bb-garnet);--badge-fg:#ffeef1}
.badge.royal{--badge-bg:var(--bb-royal);--badge-fg:#eaf3ff}
.badge.moss{--badge-bg:var(--bb-moss);--badge-fg:#f4ffe8}
.badge.brass{--badge-bg:linear-gradient(180deg,var(--bb-brass-hi),var(--bb-brass));--badge-fg:var(--bb-ink)}
.badge.iron{--badge-bg:var(--bb-iron);--badge-fg:var(--bb-text)}
/* Meters — enamel channel w/ brass frame */
.meter{--meter-fill:var(--bb-teal-hi);
  position:relative;height:18px;border-radius:var(--r-pill);
  background:var(--bb-bg-deep);box-shadow:var(--bevel-in);
  border:1px solid var(--bb-brass-lo);overflow:hidden}
.meter>i{position:absolute;inset:2px auto 2px 2px;width:calc(var(--val,50)*1% - 4px);
  border-radius:var(--r-pill);
  background:linear-gradient(180deg, color-mix(in srgb, var(--meter-fill) 80%, white 20%), var(--meter-fill));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
  transition:width var(--t-slow) var(--ease-heavy), background var(--t-med)}
.meter.warn>i{--meter-fill:var(--bb-amber)}
.meter.crit>i{--meter-fill:var(--bb-danger)}
.meter-row{display:flex;align-items:center;gap:10px;margin:6px 0}
.meter-row .lbl{width:86px;flex:none;font-size:var(--fs-tiny);letter-spacing:.08em;
  text-transform:uppercase;color:var(--bb-text-dim)}
.meter-row .num{width:52px;flex:none;text-align:right;font-family:var(--font-mono);font-size:var(--fs-small)}
.meter-row .meter{flex:1}
/* Stat pips */
.pips{display:inline-flex;gap:3px}
.pips i{width:9px;height:9px;border-radius:2px;background:var(--bb-bg-deep);
  box-shadow:var(--bevel-in);transform:rotate(45deg)}
.pips i.on{background:linear-gradient(135deg, var(--bb-brass-hi), var(--bb-brass));
  box-shadow:0 0 4px rgba(236,192,106,.5)}
/* Lever toggle (option selectors) */
.lever-group{display:grid;gap:8px}
.lever{
  display:flex;align-items:center;gap:12px;text-align:left;
  background:linear-gradient(180deg, var(--bb-surface-3), var(--bb-surface-2));
  border:1px solid var(--bb-iron);border-radius:var(--r-md);
  padding:11px 14px;box-shadow:var(--bevel-out);
  transition:transform var(--t-fast) var(--ease-heavy), border-color var(--t-fast), box-shadow var(--t-fast);
  color:var(--bb-text);width:100%;
}
.lever:hover{transform:translateX(3px)}
.lever[aria-pressed="true"]{
  border-color:var(--bb-brass);
  background:linear-gradient(180deg, #4a3722, var(--bb-surface-3));
  box-shadow:var(--bevel-out), 0 0 0 1px var(--bb-brass), 0 0 14px rgba(201,150,63,.25);
}
.lever .knob{flex:none;width:16px;height:16px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #6a5a45, #37281a 75%);
  box-shadow:var(--bevel-in);transition:background var(--t-fast)}
.lever[aria-pressed="true"] .knob{
  background:radial-gradient(circle at 35% 30%, var(--bb-brass-hi), var(--bb-brass-lo) 75%);
  box-shadow:0 0 8px rgba(236,192,106,.6)}
.lever b{display:block;font-size:var(--fs-small)}
.lever span{display:block;font-size:var(--fs-tiny);color:var(--bb-text-dim);line-height:1.35}
/* Gauge dial (SVG) */
.gauge{width:110px}
/* Ticket stub — fight poster rows */
.ticket{
  display:flex;align-items:center;gap:14px;
  background:linear-gradient(180deg, var(--bb-surface-3), var(--bb-surface-2));
  border:1px solid var(--bb-brass-lo);border-radius:var(--r-md);
  padding:12px 16px;position:relative;overflow:hidden;
}
.ticket::before{content:'';position:absolute;left:-7px;top:50%;width:14px;height:14px;border-radius:50%;
  background:var(--bb-bg);transform:translateY(-50%);border:1px solid var(--bb-brass-lo)}
.ticket::after{content:'';position:absolute;right:-7px;top:50%;width:14px;height:14px;border-radius:50%;
  background:var(--bb-bg);transform:translateY(-50%);border:1px solid var(--bb-brass-lo)}
/* Toast */
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:90;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(94vw,480px)}
.toast{background:var(--bb-parchment);color:var(--bb-ink);border-radius:var(--r-md);
  padding:10px 18px;font-weight:600;font-size:var(--fs-small);box-shadow:var(--shadow-2);
  border:1px solid var(--bb-brass);animation:toastIn var(--t-med) var(--ease-spring) both;text-align:center}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.92)}to{opacity:1;transform:none}}
.toast.leaving{animation:toastOut var(--t-med) ease both}
@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}
/* Modal drawer */
.modal-veil{position:fixed;inset:0;background:rgba(12,7,3,.72);z-index:80;
  display:flex;align-items:center;justify-content:center;padding:var(--space-4);
  animation:veilIn var(--t-med) ease both}
@keyframes veilIn{from{opacity:0}to{opacity:1}}
.modal{width:min(560px, 96vw);max-height:88vh;overflow:auto;
  animation:modalIn var(--t-med) var(--ease-spring) both}
@keyframes modalIn{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
/* Grid helpers */
.grid{display:grid;gap:var(--space-4)}
.cols-2{grid-template-columns:repeat(2, 1fr)}
.cols-3{grid-template-columns:repeat(3, 1fr)}
.row{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:var(--space-3)}
.muted{color:var(--bb-text-dim)} .faint{color:var(--bb-text-faint)}
.small{font-size:var(--fs-small)} .tiny{font-size:var(--fs-tiny)}
.mono{font-family:var(--font-mono)}
.center{text-align:center}
hr.seam{border:none;height:1px;background:linear-gradient(90deg,transparent,var(--bb-brass-lo),transparent);margin:var(--space-4) 0}

/* ============================================================
   SCREEN: ONBOARDING
   ============================================================ */
.onboard{max-width:720px;margin:0 auto}
.onboard .hero-robot{display:flex;justify-content:center;margin:var(--space-4) 0}
.step-dots{display:flex;gap:8px;justify-content:center;margin:var(--space-4) 0}
.step-dots i{width:10px;height:10px;border-radius:50%;background:var(--bb-bg-deep);box-shadow:var(--bevel-in)}
.step-dots i.on{background:radial-gradient(circle at 35% 30%, var(--bb-brass-hi), var(--bb-brass-lo))}
.lang-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lang-card{
  text-align:left;padding:12px;border-radius:var(--r-md);
  background:linear-gradient(180deg, var(--bb-surface-3), var(--bb-surface-2));
  border:1px solid var(--bb-iron);box-shadow:var(--bevel-out);
  transition:transform var(--t-fast) var(--ease-spring), border-color var(--t-fast), box-shadow var(--t-fast);
  position:relative;color:var(--bb-text);
}
.lang-card:hover{transform:translateY(-3px) rotate(-.4deg)}
.lang-card[aria-pressed="true"]{border-color:var(--lc);box-shadow:var(--bevel-out),0 0 0 1px var(--lc),0 0 16px color-mix(in srgb, var(--lc) 40%, transparent)}
.lang-card .swatch{width:26px;height:26px;border-radius:8px;background:var(--lc);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4), inset 0 -2px 3px rgba(0,0,0,.35);margin-bottom:8px;
  border:1px solid rgba(0,0,0,.4)}
.lang-card b{font-size:var(--fs-small)}
.lang-card span{display:block;font-size:var(--fs-tiny);color:var(--bb-text-dim);line-height:1.35;margin-top:2px}
.lang-card .slot-tag{position:absolute;top:8px;right:8px}
.name-input{
  width:100%;font-family:var(--font-display);font-size:var(--fs-title);text-align:center;
  background:var(--bb-bg-deep);border:1px solid var(--bb-brass-lo);border-radius:var(--r-md);
  color:var(--bb-text);padding:12px 16px;box-shadow:var(--bevel-in);letter-spacing:.06em;
}
.name-input:focus{outline:3px solid var(--bb-focus);outline-offset:2px}
.draft-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.program-card{
  text-align:left;padding:14px;border-radius:var(--r-md);color:var(--bb-text);
  background:
    linear-gradient(160deg, rgba(255,235,190,.05), transparent 40%),
    linear-gradient(180deg, var(--bb-surface-3), var(--bb-surface-2));
  border:1px solid var(--bb-iron);box-shadow:var(--bevel-out), var(--shadow-1);
  transition:transform var(--t-med) var(--ease-spring), border-color var(--t-fast), box-shadow var(--t-med);
  display:flex;flex-direction:column;gap:6px;min-height:150px;
}
.program-card:hover{transform:translateY(-4px) rotate(.5deg);box-shadow:var(--bevel-out),var(--shadow-2)}
.program-card[aria-pressed="true"]{border-color:var(--bb-teal-hi);
  box-shadow:var(--bevel-out),0 0 0 1px var(--bb-teal-hi),0 0 18px rgba(70,179,167,.3)}
.program-card .chip-art{width:44px;height:44px}
.program-card b{font-family:var(--font-display);font-size:var(--fs-sub);color:var(--bb-brass-hi)}
.program-card .trig{font-family:var(--font-mono);font-size:var(--fs-tiny);color:var(--bb-teal-hi)}
.program-card .fx{font-size:var(--fs-small);line-height:1.4}
.program-card .flavor{font-size:var(--fs-tiny);color:var(--bb-text-faint);font-style:italic;margin-top:auto}

/* ============================================================
   SCREEN: GYM (hub)
   ============================================================ */
.gym-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:var(--space-4)}
.boxer-card .portrait-stage{
  display:flex;justify-content:center;align-items:flex-end;
  background:
    radial-gradient(ellipse at 50% 90%, rgba(255,184,77,.12), transparent 60%),
    linear-gradient(180deg, var(--bb-bg-deep), var(--bb-surface));
  border-radius:var(--r-md);border:1px solid var(--bb-brass-lo);
  min-height:190px;box-shadow:var(--bevel-in);position:relative;overflow:hidden;
}

.next-poster{

.hub-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.hub-tile{
  display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
  padding:16px 10px;border-radius:var(--r-md);color:var(--bb-text);

}

/* ============================================================
   SCREEN: ROSTER / LINEAGE
   ============================================================ */
.lineage-hall{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:var(--space-4)}

}

  letter-spacing:.06em;display:inline-block;box-shadow:var(--bevel-out)}
.frame .era{font-size:var(--fs-tiny);color:var(--bb-text-faint);margin-top:4px}

/* ============================================================
   SCREEN: WORKSHOP (programs)
   ============================================================ */
.slot-bay{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)}
.slot{

}

.bank-rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.install-pulse{animation:installPulse .5s var(--ease-spring)}
@keyframes installPulse{0%{transform:scale(.9);filter:brightness(1.6)}100%{transform:scale(1)}}

/* ============================================================
   SCREEN: TRAINING & STRATEGY
   ============================================================ */
.strategy-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);align-items:start}
.scout-note{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed rgba(43,33,24,.25)}
.scout-note:last-child{border-bottom:none}
.scout-note .pin{flex:none;width:12px;height:12px;border-radius:50%;margin-top:4px;
  background:radial-gradient(circle at 35% 30%, var(--bb-garnet-hi), var(--bb-garnet));
  box-shadow:0 1px 2px rgba(0,0,0,.4)}

.gp-section{margin-bottom:var(--space-4)}
.gp-section h4{font-size:var(--fs-tiny);letter-spacing:.16em;text-transform:uppercase;

/* ============================================================
   SCREEN: FIGHT
   ============================================================ */
.arena{

}

.fighter-zone .nameplate{font-family:var(--font-display);font-size:var(--fs-small);

.robot.attack-r{animation:lungeR .45s var(--ease-heavy)}

.robot.attack-l{animation:lungeL .45s var(--ease-heavy)}
@keyframes lungeL{0%{transform:translateX(0)}18%{transform:translateX(8px)}45%{transform:translateX(-26px)}100%{transform:translateX(0)}}
.robot.ko-anim{animation:koFall 1s var(--ease-heavy) both}
@keyframes koFall{30%{transform:rotate(4deg)}100%{transform:rotate(84deg) translateY(26px);opacity:.9}}
.impact-star{position:absolute;pointer-events:none;z-index:3;animation:impact .5s var(--ease-heavy) both}

.fight-hud{display:grid;grid-template-columns:1fr auto 1fr;gap:var(--space-3);align-items:center;

.call .why{display:block;font-size:var(--fs-tiny);color:var(--bb-text-faint);font-style:italic}
.fight-controls{display:flex;gap:8px;justify-content:center;padding:var(--space-3);flex-wrap:wrap;
  background:var(--bb-surface);border-top:1px solid var(--bb-brass-lo)}
/* Intervention moment */
.intervene-veil{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;

.corner-card{width:min(520px,94%);

.token-chip{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-tiny);color:var(--bb-amber)}
.momentum{display:flex;align-items:center;gap:8px}
.momentum .track{flex:1;height:10px;border-radius:var(--r-pill);background:var(--bb-bg-deep);
  box-shadow:var(--bevel-in);position:relative;overflow:hidden}
.momentum .track i{position:absolute;top:0;bottom:0;left:50%;width:0;transition:all var(--t-slow) var(--ease-heavy)}
.momentum .track i.you{background:linear-gradient(90deg, transparent, var(--bb-teal-hi))}
.momentum .track i.them{background:linear-gradient(90deg, var(--bb-garnet-hi), transparent)}

/* ============================================================
   SCREEN: DEBRIEF
   ============================================================ */
.verdict-poster{text-align:center;padding:var(--space-6) var(--space-4)}
.verdict-poster .verdict{font-size:var(--fs-hero);letter-spacing:.12em;text-transform:uppercase;
  font-family:var(--font-display)}
.verdict-poster.win .verdict{color:var(--bb-win);text-shadow:0 0 24px rgba(143,176,94,.4)}
.verdict-poster.loss .verdict{color:var(--bb-loss);text-shadow:0 0 24px rgba(212,104,122,.35)}
.attrib-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed rgba(240,226,196,.12)}
.attrib-row:last-child{border-bottom:none}
.attrib-row .src{flex:1;font-size:var(--fs-small)}
.attrib-row .src small{display:block;color:var(--bb-text-faint);font-size:var(--fs-tiny)}
.attrib-row .gain{font-family:var(--font-mono);color:var(--bb-teal-hi);font-weight:700}
.growth-bar{height:12px;border-radius:var(--r-pill);flex:1.2;background:var(--bb-bg-deep);
  box-shadow:var(--bevel-in);overflow:hidden;position:relative}
.growth-bar i{position:absolute;inset:2px auto 2px 2px;width:0;border-radius:var(--r-pill);
  background:linear-gradient(180deg,var(--bb-teal-hi),var(--bb-teal));
  transition:width .8s var(--ease-heavy)}

/* ============================================================
   SCREEN: REPAIRS
   ============================================================ */
.bay-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)}
.repair-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed rgba(240,226,196,.12)}
.repair-row:last-child{border-bottom:none}
.repair-row .desc{flex:1}
.repair-row .desc b{font-size:var(--fs-small)}
.repair-row .desc span{display:block;font-size:var(--fs-tiny);color:var(--bb-text-dim)}
.sparks{position:relative;overflow:visible}
@keyframes sparkFly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--bb-amber);
  box-shadow:0 0 6px var(--bb-amber);animation:sparkFly .6s ease-out both;pointer-events:none}

/* ============================================================
   SCREEN: LEAGUE (campaign map)
   ============================================================ */
.campaign-path{position:relative;padding:var(--space-2) 0}
.venue-block{margin-bottom:var(--space-5)}
.venue-name{font-family:var(--font-display);color:var(--bb-brass-hi);font-size:var(--fs-sub);
  display:flex;align-items:center;gap:10px;margin-bottom:var(--space-3)}
.venue-name::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--bb-brass-lo),transparent)}
.bout-row{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.bout{
  flex:1;min-width:150px;padding:12px;border-radius:var(--r-md);position:relative;
  background:linear-gradient(180deg, var(--bb-surface-3), var(--bb-surface-2));
  border:1px solid var(--bb-iron);box-shadow:var(--bevel-out);
}
.bout.done{opacity:.75;border-color:var(--bb-moss)}
.bout.next{border-color:var(--bb-brass);box-shadow:var(--bevel-out),0 0 0 1px var(--bb-brass),0 0 18px rgba(201,150,63,.22)}
.bout.locked{opacity:.45}
.bout.boss{background:linear-gradient(180deg, #43263030, transparent), linear-gradient(180deg, var(--bb-surface-3), var(--bb-surface-2))}
.bout .b-num{position:absolute;top:-9px;left:10px;background:var(--bb-brass);color:var(--bb-ink);
  font-size:var(--fs-tiny);font-weight:800;border-radius:var(--r-pill);padding:1px 8px;box-shadow:var(--shadow-1)}
.bout b{display:block;font-size:var(--fs-small);margin-top:4px}
.bout .res{font-size:var(--fs-tiny);font-weight:700}
.rival-transmission{
  border:1px solid var(--bb-garnet);border-radius:var(--r-md);
  background:linear-gradient(180deg, rgba(176,67,83,.12), transparent), var(--bb-surface);

  animation:crackle 6s infinite steps(2);
}
@keyframes crackle{0%,94%{filter:none}95%{filter:brightness(1.2)}96%{filter:none}98%{filter:brightness(.9)}}
.rival-transmission .visor{flex:none;width:52px;height:52px;border-radius:10px;
  background:radial-gradient(circle at 50% 40%, #5a1f28, #2a1014);border:1px solid var(--bb-garnet);
  display:flex;align-items:center;justify-content:center}
.rival-transmission .visor i{width:26px;height:7px;background:var(--bb-garnet-hi);border-radius:3px;
  box-shadow:0 0 10px var(--bb-garnet-hi)}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:900px){
  .gym-grid,.strategy-grid,.bay-grid{grid-template-columns:1fr}
  .cols-3{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:640px){
  #app{padding:0 var(--space-3) 90px}

  .fighter-zone .robot svg, .fighter-zone svg{width:110px}

}

}
/* Spin ornament */
.spin-slow{animation:spin 14s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
/* Reduced motion — kill it all */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s !important;animation-iteration-count:1 !important;
    transition-duration:.001s !important}
  .spin-slow{animation:none}
}

/* ============================================================

/* ---------- Seeded RNG (Mulberry32 — same technique as engine) ---------- */
function mulberry32(seed){let t=seed>>>0;return function(){t=(t+0x6D2B79F5)|0;let r=Math.imul(t^(t>>>15),t|1);r^=r+Math.imul(r^(r>>>7),r|61);return((r^(r>>>14))>>>0)/4294967296}}

/* ---------- Static content ---------- */
const LANGS={
  rust:{name:'Rust', color:'var(--lang-rust)', temper:'unhurried, armoured, a little smug about it', signature:'Iron Curtain — a braced counter-guard', lean:'durability', voice:q=>`«${q}» — said slowly, with total certainty.`},

  c:{name:'C', color:'var(--lang-c)', temper:'ancient, blunt, terrifyingly direct', signature:'Segmentation Fold — one short, ruinous hook', lean:'power', voice:q=>`«${q}»`},

};
const OSES=[
  {id:'brasscog', name:'BrassCog 1.0', motto:'Steady hands, steady rounds.', temper:'Composed', capacity:'2 program slots', bias:'Holds shape under pressure; slow to seize openings.', flavor:'A dependable old engine that has never once panicked.'},

/* ============================================================
   FIGHT SIMULATION — Manager-Mode faithful:
   • boxer acts autonomously, every action narrated with a reason
   • gameplan (approach/priority/contingency) shapes weights
   • archetype variants + behavioural tells
   • interventions = multi-round policy shifts (1 ordinary / 2 boss)
   • growth attributed to plan/contingency/interventions
   ============================================================ */
function simulateFight(seedBase){
  const bout=ARC[S.fightIndex];
  const rng=mulberry32(seedBase);
  const arch=ARCHETYPES[bout.arch];
  const gp=S.gameplan;
  const hasProgram=id=>S.programCore===id||S.programUtility===id;
  const events=[]; const interventionsAt=[];
  const totalRounds=bout.boss?6:4;
  const maxInterv=bout.boss?2:1;
  // effectiveness modifiers
  const counterMatrix={ pressure:{bruiser:-8,counterpuncher:-12,technician:14}, counter:{bruiser:14,counterpuncher:-6,technician:-10}, technical:{bruiser:6,counterpuncher:10,technician:-4} };
  let planEdge=(counterMatrix[gp.approach]?.[bout.arch])??0;
  if(gp.priority==='punish'&&bout.arch==='bruiser')planEdge+=8;
  if(gp.priority==='drain'&&bout.arch==='technician')planEdge+=6;
  if(gp.priority==='break'&&bout.arch==='counterpuncher')planEdge+=6;
  const focusEdge=S.trainingFocus? 4:0;
  let you=100, them=100, momentum=0, heat=0, intervUsed=0;
  let policy=null, policyRounds=0;
  const youName=S.name||'YOUR BOXER';
  const L1=LANGS[S.lang1];
  const openers={
    pressure:[`walks ${bout.name} down from the bell`,'cuts the ring off early','leans on the pace immediately'],
    counter:['gives ground on purpose','waits, glove high, reading','lets the first exchange come to it'],
    technical:['claims the centre line','establishes the jab like a metronome','controls range with footwork'],
  };
  const reasons={
    pressure:'gameplan: Pressure — make them work every second',
    counter:'gameplan: Counter — answer mistakes with interest',
    technical:'gameplan: Technical — win the long argument',
  };
  events.push({t:'sys', who:'BELL', txt:`Round 1 — ${bout.name} (${arch.name}${bout.variant?', '+bout.variant.toLowerCase()+' variant':''}) at ${bout.setting}.`});
  events.push({t:'you', who:youName, txt:openers[gp.approach||'technical'][Math.floor(rng()*3)], why:reasons[gp.approach||'technical']});
  for(let r=1;r<=totalRounds;r++){
    if(r>1)events.push({t:'sys',who:'BELL',txt:`Round ${r}.`, round:r});
    const exchanges=2+Math.floor(rng()*2);
    for(let x=0;x<exchanges;x++){
      let youBias=52+planEdge+focusEdge+momentum*0.35+(policy==='exploit'?10:policy==='recover'?-8:0);
      if(gp.contingency==='shell'&&you<35)youBias-=6;
      if(hasProgram('jit'))youBias+=3;
      if(hasProgram('overclock')&&momentum<-10&&r>=3){youBias+=8;heat+=6}
      const roll=rng()*100;
      const youWinExchange=roll<youBias;
      const dmg=6+Math.floor(rng()*9)+(bout.boss?2:0);
      if(youWinExchange){
        them-=dmg;momentum=Math.min(40,momentum+dmg*.8);
        const why=policy==='exploit'?'corner call: exploiting the read'
          :gp.priority==='punish'?'priority: punishing the recovery window'
          :gp.priority==='drain'?'priority: draining their stability'
          :gp.priority==='break'?'priority: cracking the guard'
          :'OS temperament: took what was offered';
        const verbs=['lands a clean counter hook','times the jab beautifully','steps in and rips the body','catches them mid-reset','finds the gap over the guard'];
        events.push({t:'you',who:youName,txt:verbs[Math.floor(rng()*verbs.length)]+` (−${dmg})`,why,dmg,side:'them',round:r});
      }else{
        you-=dmg;momentum=Math.max(-40,momentum-dmg*.8);
        const tell=arch.tells[Math.floor(rng()*arch.tells.length)];
        events.push({t:'them',who:bout.name,txt:['answers with a heavy cross','walks through and lands','punishes the exchange'][Math.floor(rng()*3)]+` (−${dmg})`,why:`opponent pattern: ${tell}`,dmg,side:'you',round:r});
      }
      if(you<=0||them<=0)break;
    }
    if(policyRounds>0){policyRounds--;if(policyRounds===0)policy=null}
    // guard-swap contingency narration
    if(gp.contingency==='shell'&&you<35&&!events.some(e=>e.shellNote)){
      events.push({t:'you',who:youName,txt:'drops into the emergency shell',why:hasProgram('watchdog')?'Watchdog: defensive contingency triggered early (below 35% integrity)':'contingency: Emergency shell — survival first',shellNote:true,round:r});
    }
    if(you<=0||them<=0)break;
    // intervention windows: momentum swings mid-fight
    if(intervUsed<maxInterv&&r<totalRounds&&(r===Math.ceil(totalRounds/2)||(bout.boss&&r===totalRounds-1))){
      interventionsAt.push({afterEventIndex:events.length,round:r,used:intervUsed});
      intervUsed++;
      events.push({t:'interv',round:r});
    }
  }
  // decision if nobody KO'd
  let result;
  if(them<=0&&you>0)result='ko-win';
  else if(you<=0&&them>0)result='ko-loss';
  else result=(you-them+momentum*.5+planEdge*.6)>=0?'dec-win':'dec-loss';
  const won=result.endsWith('win');
  events.push({t:'sys',who:'BELL',txt:result.startsWith('ko')
    ?(won?`${bout.name} goes down! The count reaches ten.`:`${youName} is down… the count reaches ten.`)
    :`Scorecards: ${won?'unanimous decision — '+youName:'split decision — '+bout.name}.`});
  if(bout.rival&&won)events.push({t:'sys',who:'ARENA',txt:'Dr. Nullpointer’s visor cracks. The simulation stutters. Somewhere, a lease is voided.'});
  // growth attribution — fixed budget, scaled by difficulty/outcome
  const budget=(bout.boss?8:5)+(won?2:0);
  const attribution=[
    {src:'Approach: '+(GAMEPLAN.approach.find(a=>a.id===gp.approach)?.name||'—'), note:planEdge>=8?'read the matchup well':planEdge<=-6?'ran into their strength':'a fair trade', pts:Math.max(1,Math.round(budget*.4))},
    {src:'Priority: '+(GAMEPLAN.priority.find(a=>a.id===gp.priority)?.name||'—'), note:'shaped the exchanges you won', pts:Math.max(1,Math.round(budget*.25))},
    {src:'Contingency: '+(GAMEPLAN.contingency.find(a=>a.id===gp.contingency)?.name||'—'), note:'insurance, cashed or not', pts:Math.max(0,Math.round(budget*.15))},
  ];
  return {bout,arch,events,interventionsAt,result,won,youHp:Math.max(0,you),themHp:Math.max(0,them),budget,attribution,totalRounds};
}

function chipArt(id){
  const glyphs={profiler:'M7 17 L12 7 L17 17 M9.5 13.5 h5',firewall:'M12 4 l7 3 v5 c0 5 -4 7 -7 8 c-3 -1 -7 -3 -7 -8 v-5 z',jit:'M13 3 L6 14 h5 l-1 7 l8 -12 h-5 z',rollback:'M12 5 a7 7 0 1 1 -6.3 4 M6 4 v5 h5',watchdog:'M6 10 l3 -4 h6 l3 4 v4 a6 3.5 0 0 1 -12 0 z M9.5 12 h.01 M14.5 12 h.01',overclock:'M12 4 a8 8 0 0 1 8 8 h-3 M12 4 a8 8 0 0 0 -8 8 h3 M12 12 l4 -3'};
  return `<svg class="chip-art" viewBox="0 0 24 24" fill="none" stroke="var(--bb-teal-hi)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="2.5" y="2.5" width="19" height="19" rx="4" stroke="var(--bb-brass-lo)"/>
    <path d="${glyphs[id]||glyphs.jit}"/></svg>`;
}

function startFight(){
  const sim=simulateFight(1000+S.fightIndex*7919+S.wins*131);
  FIGHT={sim,idx:0,you:100,them:100,mo:0,round:1,speed:1,timer:null,paused:false,done:false,
    tokens:sim.bout.boss?2:1,intervChoices:[]};
  nav('fight');
  setTimeout(stepFight, 900);
}
function stepFight(){
  const f=FIGHT;if(!f||f.paused||f.done)return;
  const ev=f.sim.events[f.idx];
  if(!ev){finishFight();return}
  f.idx++;
  if(ev.t==='interv'){
    if(f.tokens>0){showIntervention(ev);return}
    // no tokens left — corner stays quiet
    addCall({t:'sys',who:'CORNER',txt:'The corner watches. No calls left — trust the machine.'});
    scheduleNext(700);return;
  }
  if(ev.round)updateRound(ev.round);
  addCall(ev);
  if(ev.dmg){
    if(ev.side==='them'){f.them=Math.max(0,f.them-ev.dmg);punch('you')}
    else{f.you=Math.max(0,f.you-ev.dmg);punch('them')}
    f.mo=Math.max(-40,Math.min(40,f.mo+(ev.side==='them'?ev.dmg:-ev.dmg)));
    updateMeters();
  }
  scheduleNext(ev.t==='sys'?950:820);
}
function scheduleNext(base){
  const f=FIGHT;if(!f)return;
  clearTimeout(f.timer);
  f.timer=setTimeout(stepFight, REDUCED?40:Math.round(base/f.speed));
}
function updateRound(r){FIGHT.round=r;const el=$('#round-num');if(el){el.textContent=r;
  if(!REDUCED){el.animate([{transform:'scale(1.6)',color:'#ffd98a'},{transform:'scale(1)'}],{duration:420,easing:'cubic-bezier(.28,1.4,.42,1)'})}}}
function updateMeters(){
  const f=FIGHT;
  const hy=$('#hp-you'),ht=$('#hp-them');
  if(hy){hy.style.setProperty('--val',f.you);hy.parentElement.classList.toggle('crit',f.you<35);hy.parentElement.classList.toggle('warn',f.you>=35&&f.you<65)}
  if(ht)ht.style.setProperty('--val',f.them);
  const my=$('#mo-you'),mt=$('#mo-them');
  if(my&&mt){
    if(f.mo>=0){my.style.width=(f.mo*1.25)+'%';mt.style.width='0'}
    else{mt.style.width=(-f.mo*1.25)+'%';mt.style.left=(50+f.mo*1.25)+'%';my.style.width='0'}
    if(f.mo>=0){my.style.left='50%'}
  }
}
function punch(side){
  if(REDUCED)return;
  const atk=$(side==='you'?'#bot-you':'#bot-them'),def=$(side==='you'?'#bot-them':'#bot-you');
  if(atk){atk.firstElementChild.classList.remove('attack-r','attack-l');void atk.offsetWidth;
    atk.firstElementChild.classList.add(side==='you'?'attack-r':'attack-l')}
  if(def){def.firstElementChild.classList.remove('hit');void def.offsetWidth;def.firstElementChild.classList.add('hit');
    const star=document.createElementNS('http://www.w3.org/2000/svg','svg');
    star.setAttribute('viewBox','0 0 40 40');star.classList.add('impact-star');
    star.style.cssText=`width:44px;top:${30+Math.random()*25}%;${side==='you'?'right:16%':'left:16%'}`;
    star.innerHTML='<path d="M20 2 L24 14 L37 12 L27 20 L34 32 L21 26 L12 37 L14 23 L3 18 L16 16 Z" fill="var(--bb-amber)" stroke="var(--bb-brass-lo)" stroke-width="1.5"/>';
    def.parentElement.appendChild(star);setTimeout(()=>star.remove(),520)}
}
function addCall(ev){
  const wrap=$('#calls');if(!wrap)return;
  const div=document.createElement('div');
  div.className='call '+(ev.t==='you'?'you':ev.t==='them'?'them':'sys');
  div.innerHTML=`<span class="who">${esc(ev.who)}</span><span>${esc(ev.txt)}${ev.why?`<span class="why">— ${esc(ev.why)}</span>`:''}</span>`;
  wrap.appendChild(div);wrap.scrollTop=wrap.scrollHeight;
}
function showIntervention(){
  const f=FIGHT;f.paused=true;
  const root=$('#intervene-root');
  root.innerHTML=`<div class="intervene-veil">
    <div class="plate rivets corner-card" role="dialog" aria-modal="true" aria-label="Corner decision">
      <p class="plate-kicker">The bell — your corner leans in</p>
      <h3 class="plate-title" style="font-size:var(--fs-sub)">${f.mo>=0?'You have them wobbling. What’s the call?':'You’re losing the rhythm. What’s the call?'}</h3>
      <p class="tiny muted">A call shifts policy for the next rounds — it is never a single scripted punch.</p>
      <div class="options">
        ${INTERVENTIONS.map(o=>`<button class="lever" data-act="intervene" data-choice="${o.id}">
          <span class="knob"></span>
          <span style="flex:1"><b>${o.name}${o.id==='trust'?' <span class="tiny" style="color:var(--bb-amber)">(keeps the token)</span>':''}</b>
          <span>${o.tip}</span></span>
        </button>`).join('')}
      </div>
    </div>
  </div>`;
  const first=root.querySelector('.lever');if(first)first.focus();
}
function applyIntervention(choice){
  const f=FIGHT;
  $('#intervene-root').innerHTML='';
  f.paused=false;
  if(choice!=='trust'){f.tokens--;const tc=$('#token-count');if(tc)tc.textContent=f.tokens}
  f.intervChoices.push(choice);
  const lines={
    exploit:{txt:'Corner call: “Exploit the opening — commit to the read.”',why:'policy shift: aggression up for the coming rounds'},
    recover:{txt:'Corner call: “Recover stability — give a round, buy the fight back.”',why:'policy shift: defence and footing first'},
    trust:{txt:'The corner nods. No instruction. The machine fights its own fight.',why:'trust — the token stays in your pocket'},
  };
  addCall({t:'sys',who:'CORNER',txt:lines[choice].txt,why:lines[choice].why});
  // reflect into sim outcomes lightly: exploit boosts, recover heals a little
  if(choice==='exploit'){f.mo=Math.min(40,f.mo+8)}
  if(choice==='recover'){f.you=Math.min(100,f.you+7);updateMeters();}
  scheduleNext(900);
}
function finishFight(){
  const f=FIGHT;if(f.done)return;f.done=true;
  const sim=f.sim;const won=sim.won;
  // integrity + record + log
  if(won)S.wins++;else{S.losses++;S.integrity=Math.max(0,S.integrity-1)}
  S.condition=Math.max(12,S.condition-(won?14:26));
  S.scrap+=won?(sim.bout.boss?70:40):15;
  S.log.push({n:sim.bout.n,opp:sim.bout.name,venue:sim.bout.setting,won,how:sim.result.startsWith('ko')?(won?'KO':'KO’d'):(won?'decision':'lost decision')});
  S.lastFight={won,result:sim.result,bout:sim.bout.n,attribution:sim.attribution,budget:sim.budget,
    interv:f.intervChoices,youHp:f.you,themHp:f.them,boss:sim.bout.boss,rival:!!sim.bout.rival};
  // KO fall animation then debrief
  const loserEl=$(won?'#bot-them':'#bot-you');
  if(loserEl&&!REDUCED){loserEl.firstElementChild.classList.add('ko-anim')}
  if(sim.bout.boss&&won&&!S.bank.length){S.bank=PROGRAMS.filter(p=>![S.programCore,S.programUtility].includes(p.id)).slice(0,2).map(p=>p.id)}
  else if(sim.bout.boss&&won){const extra=PROGRAMS.find(p=>![...S.bank,S.programCore,S.programUtility].includes(p.id));if(extra)S.bank.push(extra.id)}
  if(won&&S.fightIndex<ARC.length-1)S.fightIndex++;
  else if(won&&S.fightIndex===ARC.length-1)S.arcDone=true;
  save();purse();
  setTimeout(()=>nav('debrief'), REDUCED?200:1400);
}

        <p class="tiny faint" style="margin-top:10px">Growth credits the plan you set and the calls you made — never autopilot spam. Caps and diminishing returns apply.</p>

/* ============================================================
   INTERACTIONS (event delegation) + BOOT
   ============================================================ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const act=el.dataset.act;
  switch(act){
    case 'ob-next':{
      if(S.onboardStep===2){const n=$('#bname');if(n)S.name=n.value.trim().toUpperCase().slice(0,20)||'TIN CANNON'}
      S.onboardStep=Math.min(3,S.onboardStep+1);save();render();break}
    case 'ob-back':{S.onboardStep=Math.max(0,S.onboardStep-1);save();render();break}
    case 'pick-lang':{
      const id=el.dataset.lang;
      if(S.lang1===id){S.lang1=S.lang2;S.lang2=null}
      else if(S.lang2===id){S.lang2=null}
      else if(!S.lang1)S.lang1=id;
      else if(!S.lang2&&id!==S.lang1)S.lang2=id;
      else{S.lang2=id}
      save();render();break}
    case 'pick-os':{const n=$('#bname');if(n)S.name=n.value.trim().toUpperCase().slice(0,20);S.os=el.dataset.os;save();render();break}
    case 'draft-program':{
      const id=el.dataset.prog;const p=PROGRAMS.find(x=>x.id===id);
      S.programCore=null;S.programUtility=null;
      if(p.kind==='core')S.programCore=id;else S.programUtility=id;
      save();render();break}
    case 'ob-finish':{
      if(!S.name)S.name='TIN CANNON';
      S.screen='gym';S.onboardStep=0;save();renderNav();render();
      toast(`${S.name} is on the books. Welcome to the gym, manager.`);break}
    case 'scout':{S.scouted.push(ARC[S.fightIndex].n);save();render();toast('Film studied — two tells confirmed.');break}
    case 'focus':{S.trainingFocus=el.dataset.focus;save();render();break}
    case 'gp':{S.gameplan[el.dataset.key]=el.dataset.val;save();render();break}
    case 'to-fight-check':{
      const gp=S.gameplan;
      if(gp.approach&&gp.priority&&gp.contingency)startFight();
      else nav('strategy');break}
    case 'to-fight':{startFight();break}
    case 'speed':{FIGHT.speed=FIGHT.speed===1?2:1;el.textContent=FIGHT.speed===2?'Speed ×1':'Speed ×2';
      el.setAttribute('aria-pressed',FIGHT.speed===2);break}
    case 'skip':{ // fast-forward to next intervention or end
      if(!FIGHT||FIGHT.done)break;clearTimeout(FIGHT.timer);
      let guard=0;
      while(!FIGHT.paused&&!FIGHT.done&&guard<200){
        const ev=FIGHT.sim.events[FIGHT.idx];
        if(!ev){finishFight();break}
        FIGHT.idx++;
        if(ev.t==='interv'){if(FIGHT.tokens>0){showIntervention(ev)}else{addCall({t:'sys',who:'CORNER',txt:'No calls left — trust the machine.'})}break}
        if(ev.round)updateRound(ev.round);
        addCall(ev);
        if(ev.dmg){if(ev.side==='them')FIGHT.them=Math.max(0,FIGHT.them-ev.dmg);else FIGHT.you=Math.max(0,FIGHT.you-ev.dmg)}
        guard++;
      }
      updateMeters();break}
    case 'intervene':{applyIntervention(el.dataset.choice);break}
    case 'to-repairs':{nav('repairs');break}
    case 'repair-basic':{
      S.condition=100;save();sparksAt('#repair-stage');render();toast('Serviced. She hums like new.');break}
    case 'repair-tune':{S.scrap-=30;save();purse();sparksAt('#repair-stage');render();toast('Deep tune complete — reads will come a beat faster.');break}
    case 'repair-polish':{S.scrap-=15;save();purse();sparksAt('#repair-stage');render();toast('Gleaming. Objectively unnecessary. Absolutely worth it.');break}
    case 'install':{
      const id=el.dataset.prog;const p=PROGRAMS.find(x=>x.id===id);
      if(p.kind==='core')S.programCore=id;else S.programUtility=id;
      S.bank=S.bank.filter(b=>b!==id);
      save();render();toast(`${p.name} installed to the ${p.kind} slot.`);break}
    case 'uninstall':{
      const slot=el.dataset.slot;
      const id=slot==='core'?S.programCore:S.programUtility;
      if(id)S.bank.push(id);
      if(slot==='core')S.programCore=null;else S.programUtility=null;
      save();render();break}
    case 'new-gen':{
      const heirloom=S.programCore||S.programUtility;
      S.lineage.push({name:S.name,l1:S.lang1,l2:S.lang2,record:`${S.wins}–${S.losses}`,era:S.arcDone?'CHAMPION':'RETIRED',fell:!S.arcDone,heirloom});
      const keepLineage=S.lineage;
      S={...DEFAULT_STATE,lineage:keepLineage,seenIntro:true};
      if(heirloom){const p=PROGRAMS.find(x=>x.id===heirloom);if(p.kind==='core')S.programCore=heirloom;else S.programUtility=heirloom}
      save();renderNav();nav('onboarding');
      toast('A new chassis waits on the bench — the heirloom is already installed.');break}
    case 'reset-proto':{resetAll();break}
  }
});
/* Keyboard: arrow-key navigation across main tabs; Enter/Space native on buttons */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&FIGHT&&FIGHT.paused){/* modal is a required decision — no escape-close, by design */}
  if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&e.target.closest('.tab-rail')){
    const tabs=[...document.querySelectorAll('.tab:not(:disabled)')];
    const i=tabs.indexOf(document.activeElement);
    if(i>-1){e.preventDefault();const n=tabs[(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length];n.focus()}
  }
});
function sparksAt(sel){
  if(REDUCED)return;const host=$(sel);if(!host)return;
  for(let i=0;i<10;i++){const s=document.createElement('i');s.className='spark';
    s.style.cssText=`left:${40+Math.random()*20}%;top:${50+Math.random()*20}%;--dx:${(Math.random()-0.5)*140}px;--dy:${-30-Math.random()*90}px;animation-delay:${Math.random()*.15}s`;
    host.appendChild(s);setTimeout(()=>s.remove(),800)}
}
/* Debrief growth bars animate in after paint */
function afterRender(){
  document.querySelectorAll('.growth-bar i[data-w]').forEach(b=>{
    requestAnimationFrame(()=>requestAnimationFrame(()=>{b.style.width=b.dataset.w+'%'}))
  });
  const bn=$('#bname');
  if(bn){bn.addEventListener('input',()=>{S.name=bn.value.toUpperCase().slice(0,20)},{passive:true})}
}
function render(){
  try{
    renderNav();
    const fn=SCREENS[S.screen]||SCREENS.gym;
    $('#stage').innerHTML=`<div class="screen">${fn()}</div>`;
    purse();afterRender();
  }catch(err){
    $('#stage').innerHTML=`<section class="plate center"><h2 class="plate-title">The workshop hit a snag</h2>
      <p class="small muted mono">${esc(err.message)}</p>
      <button class="btn" data-act="reset-proto" style="margin-top:12px">Reset the prototype</button></section>`;
  }
}
render();
</script>
</body>
</html>
